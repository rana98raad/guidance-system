<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استمارة بيانات الطالب – الإرشاد التربوي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --g:#1a4d3a; --line:#cfd8d3; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Cairo',Tahoma,Arial,sans-serif; background:#f3f6f4; color:#1f2a26; }
  header { background:var(--g); color:#fff; text-align:center; padding:18px 12px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:14px; opacity:.9; }
  main { max-width:720px; margin:0 auto; padding:14px; }
  .prog { display:flex; gap:6px; margin:6px 0 14px; }
  .prog i { flex:1; height:6px; border-radius:3px; background:#d5ddd9; }
  .prog i.on { background:var(--g); }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card[hidden], .field[hidden] { display:none; }
  h2 { margin:0 0 14px; font-size:18px; color:var(--g); }
  .field { margin-bottom:14px; }
  label.t { display:block; font-weight:600; margin-bottom:6px; font-size:15px; }
  label.req::after { content:' *'; color:var(--bad); }
  input[type=text], input[type=tel], input[type=date], select, textarea {
    width:100%; padding:11px; font:inherit; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:80px; resize:vertical; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opts label { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--line);
                border-radius:20px; cursor:pointer; font-size:15px; background:#fafcfb; }
  .opts input { accent-color:var(--g); }
  .err { border-color:var(--bad) !important; }
  .nav { display:flex; gap:10px; margin-top:16px; }
  button { flex:1; padding:13px; font:inherit; font-weight:700; font-size:16px; border:0; border-radius:10px; cursor:pointer; }
  .next, .send { background:var(--g); color:#fff; }
  .back { background:#e3e9e6; color:#222; }
  button:disabled { opacity:.6; cursor:default; }
  #photoPrev { width:110px; height:140px; object-fit:cover; border:1px solid var(--line); border-radius:8px; margin-top:8px; display:none; }
  #msg { margin-top:10px; color:var(--bad); font-size:14px; min-height:18px; text-align:center; }
  .done { text-align:center; padding:30px 10px; }
  .done h2 { font-size:22px; }
</style>
</head>
<body>
<header>
  <h1>استمارة بيانات الطالب – الإرشاد التربوي</h1>
  <p>إعدادية الديوانية المهنية للبنات</p>
</header>
<main>
  <div class="prog" id="prog"></div>
  <form id="form" onsubmit="return false"><div id="steps"></div></form>
  <div class="nav" id="nav">
    <button class="back" id="backBtn" onclick="go(-1)">السابق</button>
    <button class="next" id="nextBtn" onclick="go(1)">التالي</button>
    <button class="send" id="sendBtn" onclick="submitForm()">إرسال الاستمارة</button>
  </div>
  <div id="msg"></div>
  <div class="card done" id="done" hidden>
    <h2>✅ تم إرسال الاستمارة بنجاح</h2>
    <p>رقم الطالب: <b id="doneId"></b></p>
    <button class="next" style="max-width:260px" onclick="location.reload()">استمارة جديدة</button>
  </div>
</main>

<script>
/* ===================== الإعدادات ===================== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycby6b2UNFOXac-tlPhJAKhOFFXcheN8gsHeoobnwQprVvTvdFzsdZAxdk0FyQUzxQKil/exec';

// أقسام المدرسة (تقدرين أيضاً تكتبين قسماً غير موجود بالقائمة)
const DEPARTMENTS = ['أمن سيبراني', 'أجهزة طبية', 'تجاري', 'صيانة حاسبات', 'فنون'];
const STAGES = ['الأولى', 'الثانية', 'الثالثة'];
const DIVS = ['أ', 'ب', 'ج', 'د'];
const YN = ['نعم', 'لا'];

/* ===================== تعريف الحقول (الأسماء = أسماء أعمدة الشيت) ===================== */
const F = (name, type, o) => Object.assign({ name: name, type: type }, o || {});

function parent(p) {
  const alive = 'هل ' + p + ' على قيد الحياة';
  return [
    F('اسم ' + p + ' الثلاثي', 'text'),
    F('تحصيل ' + p + ' الدراسي', 'text'),
    F('مهنة ' + p + ' ومكان العمل', 'text'),
    F('رقم موبايل ' + p, 'tel'),
    F(alive, 'radio', { options: YN }),
    F('سبب وفاة ' + p, 'radio', { options: ['إرهاب', 'مرض', 'شهيد', 'حادث', 'طبيعي'], showIf: [alive, 'لا'] }),
    F('سنة وفاة ' + p, 'text', { showIf: [alive, 'لا'] })
  ];
}

const STEPS = [
  { title: '١) بيانات الطالب', fields: [
    F('اسم الطالب الثلاثي', 'text', { req: 1 }),
    F('القسم', 'combo', { req: 1, options: DEPARTMENTS }),
    F('الصف', 'select', { req: 1, options: STAGES, label: 'الصف / المرحلة' }),
    F('الشعبة', 'select', { req: 1, options: DIVS }),
    F('تاريخ الولادة', 'date'),
    F('محافظة الولادة', 'text'),
    F('العنوان', 'text'),
    F('photo', 'photo', { label: 'صورة الطالب' })
  ]},
  { title: '٢) بيانات الأب', fields: parent('الأب') },
  { title: '٣) بيانات الأم', fields: parent('الأم') },
  { title: '٤) ولي الأمر والسكن', fields: [
    F('اسم ولي الأمر', 'text'),
    F('صلة ولي الأمر بالطالب', 'text'),
    F('رقم موبايل ولي الأمر', 'tel'),
    F('يعيش الطالب مع', 'radio', { options: ['كلا الوالدين', 'مع الأب', 'مع الأم', 'آخرون'] }),
    F('آخرون وهم', 'text', { showIf: ['يعيش الطالب مع', 'آخرون'] }),
    F('نوع السكن', 'radio', { options: ['ملك', 'ايجار', 'اخرى'] }),
    F('هل الطالب يعمل', 'radio', { options: YN }),
    F('عمل الطالب', 'text', { showIf: ['هل الطالب يعمل', 'نعم'] }),
    F('هل الطالب متزوج', 'radio', { options: YN }),
    F('اسم الزوجة', 'text', { showIf: ['هل الطالب متزوج', 'نعم'] })
  ]},
  { title: '٥) الصحة والسلوك والتحصيل', fields: [
    F('هل يعاني من أمراض مزمنة', 'radio', { options: YN }),
    F('نوع المرض', 'checks', { options: ['سكر', 'ضغط', 'قلب', 'مرض بالعين', 'صرع', 'جلدي', 'أخرى'], showIf: ['هل يعاني من أمراض مزمنة', 'نعم'] }),
    F('هل يراجع طبيب اختصاص', 'radio', { options: YN }),
    F('اسم الطبيب', 'text', { showIf: ['هل يراجع طبيب اختصاص', 'نعم'], label: 'من هو الطبيب' }),
    F('المشاكل النفسية والتربوية والسلوكية', 'checks', { options: ['خجول', 'انطواء', 'قلق', 'مشاكل بالنطق', 'مشاكل بالسمع', 'بول لا إرادي', 'يكذب', 'مشاغب', 'كتوم', 'لا يحترم', 'يخاف', 'لا يحب المدرسة'] }),
    F('عدد سنوات الرسوب', 'text'),
    F('الصفوف التي رسب فيها', 'text'),
    F('المواد التي رسب فيها', 'text'),
    F('الموهبة', 'checks', { options: ['رياضية', 'رسم', 'خطابة وشعر', 'أخرى'], label: 'هل يمتلك موهبة' })
  ]},
  { title: '٦) بيانات الفقدان (للطباعة)', fields: [
    F('نوع الفقدان', 'radio', { options: ['طلاق', 'وفاة', 'استشهاد', 'أخرى'] }),
    F('_lossOther', 'text', { label: 'حددي نوع الفقدان', showIf: ['نوع الفقدان', 'أخرى'] }),
    F('المستوى العلمي قبل الفقدان', 'textarea'),
    F('المستوى العلمي بعد الفقدان', 'textarea'),
    F('سلوك الطالب ومواظبته', 'textarea'),
    F('ملاحظات المرشد التربوي', 'textarea')
  ]}
];

/* ===================== بناء الواجهة ===================== */
let cur = 0;

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fieldEl(fd) {
  const d = document.createElement('div');
  d.className = 'field';
  d.dataset.name = fd.name;
  d.dataset.type = fd.type;
  if (fd.req) d.dataset.req = '1';
  if (fd.showIf) { d.dataset.ctl = fd.showIf[0]; d.dataset.val = fd.showIf[1]; d.hidden = true; }

  let html = '<label class="t' + (fd.req ? ' req' : '') + '">' + esc(fd.label || fd.name) + '</label>';
  const opts = fd.options || [];
  if (fd.type === 'text') html += '<input type="text" autocomplete="off">';
  else if (fd.type === 'tel') html += '<input type="tel" inputmode="tel" autocomplete="off">';
  else if (fd.type === 'date') html += '<input type="date">';
  else if (fd.type === 'textarea') html += '<textarea></textarea>';
  else if (fd.type === 'combo') {
    html += '<input type="text" list="dl_' + esc(fd.name) + '" autocomplete="off">' +
            '<datalist id="dl_' + esc(fd.name) + '">' + opts.map(function (o) { return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
  } else if (fd.type === 'select') {
    html += '<select><option value="">— اختاري —</option>' + opts.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
  } else if (fd.type === 'radio' || fd.type === 'checks') {
    const t = fd.type === 'radio' ? 'radio' : 'checkbox';
    html += '<div class="opts">' + opts.map(function (o) {
      return '<label><input type="' + t + '" name="' + esc(fd.name) + '" value="' + esc(o) + '"> ' + esc(o) + '</label>';
    }).join('') + '</div>';
  } else if (fd.type === 'photo') {
    html += '<input type="file" id="photo" accept="image/*"><img id="photoPrev" alt="">';
  }
  d.innerHTML = html;
  return d;
}

function build() {
  const root = document.getElementById('steps');
  const prog = document.getElementById('prog');
  STEPS.forEach(function (s, i) {
    const sec = document.createElement('section');
    sec.className = 'card step';
    sec.dataset.i = i;
    sec.hidden = i !== 0;
    sec.innerHTML = '<h2>' + esc(s.title) + '</h2>';
    s.fields.forEach(function (fd) { sec.appendChild(fieldEl(fd)); });
    root.appendChild(sec);
    prog.appendChild(document.createElement('i'));
  });
  document.addEventListener('change', updateVisibility);
  document.getElementById('photo').addEventListener('change', function (e) {
    const f = e.target.files[0], img = document.getElementById('photoPrev');
    if (f) { img.src = URL.createObjectURL(f); img.style.display = 'block'; } else { img.style.display = 'none'; }
  });
  show(0);
}

function radioVal(name) {
  const c = document.querySelector('input[type=radio][name="' + name + '"]:checked');
  return c ? c.value : '';
}

function updateVisibility() {
  document.querySelectorAll('.field[data-ctl]').forEach(function (d) {
    d.hidden = radioVal(d.dataset.ctl) !== d.dataset.val;
  });
}

function show(i) {
  cur = i;
  document.querySelectorAll('.step').forEach(function (s) { s.hidden = Number(s.dataset.i) !== i; });
  document.querySelectorAll('#prog i').forEach(function (p, k) { p.className = k <= i ? 'on' : ''; });
  document.getElementById('backBtn').style.display = i === 0 ? 'none' : '';
  document.getElementById('nextBtn').style.display = i === STEPS.length - 1 ? 'none' : '';
  document.getElementById('sendBtn').style.display = i === STEPS.length - 1 ? '' : 'none';
  document.getElementById('msg').textContent = '';
  window.scrollTo(0, 0);
}

function validate(i) {
  let ok = true;
  document.querySelectorAll('.step[data-i="' + i + '"] .field[data-req]').forEach(function (d) {
    if (d.hidden) return;
    const el = d.querySelector('input,select,textarea');
    const bad = !el.value.trim();
    el.classList.toggle('err', bad);
    if (bad) ok = false;
  });
  return ok;
}

function go(dir) {
  if (dir > 0 && !validate(cur)) {
    document.getElementById('msg').textContent = 'يرجى ملء الحقول المطلوبة (*)';
    return;
  }
  show(Math.max(0, Math.min(STEPS.length - 1, cur + dir)));
}

/* ===================== الإرسال ===================== */
function collect() {
  const data = {};
  document.querySelectorAll('.field').forEach(function (d) {
    if (d.hidden) return;
    const n = d.dataset.name, t = d.dataset.type;
    if (t === 'photo') return;
    if (t === 'radio') {
      const c = d.querySelector('input:checked');
      if (c) data[n] = c.value;
    } else if (t === 'checks') {
      const v = Array.prototype.map.call(d.querySelectorAll('input:checked'), function (i) { return i.value; });
      if (v.length) data[n] = v;
    } else {
      const el = d.querySelector('input,select,textarea');
      if (el && el.value.trim()) data[n] = el.value.trim();
    }
  });
  if (data['نوع الفقدان'] === 'أخرى' && data._lossOther) data['نوع الفقدان'] = data._lossOther;
  delete data._lossOther;
  return data;
}

function compressPhoto(file, maxSide) {
  maxSide = maxSide || 600;
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL('image/jpeg', 0.8), mime: 'image/jpeg', name: 'photo.jpg' });
    };
    img.onerror = function () { reject(new Error('تعذر قراءة الصورة')); };
    img.src = URL.createObjectURL(file);
  });
}

async function submitForm() {
  if (!validate(0)) { show(0); document.getElementById('msg').textContent = 'يرجى ملء الحقول المطلوبة (*) في الخطوة الأولى'; return; }
  const btn = document.getElementById('sendBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...'; msg.textContent = '';
  try {
    const body = collect();
    const file = document.getElementById('photo').files[0];
    if (file) body.photo = await compressPhoto(file);
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'خطأ غير معروف');
    document.getElementById('steps').hidden = true;
    document.getElementById('prog').hidden = true;
    document.getElementById('nav').hidden = true;
    document.getElementById('doneId').textContent = out.id;
    document.getElementById('done').hidden = false;
    window.scrollTo(0, 0);
  } catch (e) {
    msg.textContent = 'تعذر الإرسال: ' + e.message + ' — حاولي مرة ثانية.';
    btn.disabled = false; btn.textContent = 'إرسال الاستمارة';
  }
}

build();
</script>
</body>
</html>
